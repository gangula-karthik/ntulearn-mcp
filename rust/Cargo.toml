[workspace]
resolver = "2"
members = ["crates/ntulearn-mcp"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/gangula-karthik/ntulearn-mcp"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "http2", "rustls-tls", "gzip", "brotli", "deflate"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
scraper = "0.23"
ammonia = "4"
rusqlite = { version = "0.37", features = ["bundled"] }
dirs = "6"
percent-encoding = "2"
sha2 = { version = "0.10", features = ["std"] }
csv = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ultrafast-mcp = { version = "202506018.1.0", features = ["http"] }
