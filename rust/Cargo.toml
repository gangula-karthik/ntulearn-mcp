[workspace]
resolver = "2"
members = ["crates/ntulearn-mcp"]

[workspace.package]
version = "0.7.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/gangula-karthik/ntulearn-mcp"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: TOON + JSON outputs must preserve field encounter order
# (spec §8), and construction order is the natural key order everywhere.
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "http2", "rustls-tls", "gzip", "brotli", "deflate"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
scraper = "0.23"
ammonia = "4"
rusqlite = { version = "0.37", features = ["bundled"] }
dirs = "6"
fs2 = "0.4"
percent-encoding = "2"
sha2 = { version = "0.10", features = ["std"] }
csv = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
ultrafast-mcp = { version = "202506018.1.0", features = ["http"] }
semver = "1"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
minisign-verify = "0.2"
